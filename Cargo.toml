[package]
name = "cirun-agent"
version = "0.5.2"
edition = "2021"
description = "Cirun on-prem agent: provisions and manages CI/CD runners via Docker, Meda (Linux KVM VMs), and Lume (macOS VMs)."
license = "MIT"
repository = "https://github.com/cirunlabs/cirun-agent"
homepage = "https://cirun.io"
documentation = "https://docs.cirun.io/on-prem"
readme = "README.md"
keywords = ["cirun", "ci", "github-actions", "self-hosted", "runner"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Amit Kumar <amit@cirun.io>"]

[dependencies]
clap = { version = "4.5.32", features = ["derive", "env"] }
env_logger = "0.11.7"
log = "0.4.26"
reqwest = { version = "0.12.14", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4"] }
thiserror = "2.0.12"
url = "2.5.4"
tempfile = "3.18.0"
backon = "1.4.0"
anyhow = "1.0.97"
flate2 = "1.1.0"
tar = "0.4.44"
walkdir = "2.5.0"
chrono = "0.4.40"
async-trait = "0.1.83"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
